# Builds whisper-faster for Windows, macOS (Intel and Apple Silicon) and Linux,
# with the zip names Tero downloads, and the optional GPU libraries for
# Windows.
#
# - Every month (and with Actions > Build > Run workflow > "update") it looks
#   for new versions of faster-whisper, CTranslate2 and the rest. If there
#   are, it builds and tests them (a real transcription on each system) and
#   only then commits the new pins to main, tags vX.Y.0 and publishes the
#   release. If nothing is new, or a build or test fails, nothing changes.
# - A tag "v*" pushed by hand publishes a release with the current pins.
# - A manual run without "update" leaves the zips as artifacts of the run.

name: Build

on:
  schedule:
    - cron: "0 6 1 * *" # day 1 of each month, 06:00 UTC
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      update:
        description: "Look for new versions and publish a release if there are"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
      release: ${{ steps.check.outputs.release }}
      update: ${{ steps.check.outputs.update }}
      version: ${{ steps.check.outputs.version }}
      summary: ${{ steps.check.outputs.summary }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Look for new versions
        id: check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.update }}" = "true" ]; then
            python -m venv /tmp/venv
            /tmp/venv/bin/python -m pip install --quiet --upgrade pip
            /tmp/venv/bin/python tools/update_pins.py > /tmp/pins.txt
            cat /tmp/pins.txt
            cat /tmp/pins.txt >> $GITHUB_OUTPUT
            changed=$(grep '^changed=' /tmp/pins.txt | cut -d= -f2)
            echo "update=$changed" >> $GITHUB_OUTPUT
            echo "build=$changed" >> $GITHUB_OUTPUT
            echo "release=$changed" >> $GITHUB_OUTPUT
          else
            echo "update=false" >> $GITHUB_OUTPUT
            echo "build=true" >> $GITHUB_OUTPUT
            echo "release=${{ startsWith(github.ref, 'refs/tags/v') }}" >> $GITHUB_OUTPUT
            echo "version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' whisper_faster.py)" >> $GITHUB_OUTPUT
          fi
          git diff --stat

      - name: Keep the files with the new versions
        if: steps.check.outputs.update == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: sources
          path: |
            requirements.txt
            requirements-build.txt
            whisper_faster.py

      # GitHub turns off the scheduled workflows of a repository without
      # commits for 60 days, this keeps the monthly check on
      - name: Keep the schedule on
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/build.yml/enable" || true

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            zip: fasterwhisper_win64.zip
          - os: macos-15
            zip: fasterwhisper_macos_arm64.zip
            platform: macosx_11_0_arm64
          - os: macos-15-intel
            zip: fasterwhisper_macos_x86_64.zip
            platform: macosx_11_0_x86_64
          - os: ubuntu-22.04
            zip: fasterwhisper_linux.zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: New versions
        if: needs.check.outputs.update == 'true'
        uses: actions/download-artifact@v7
        with:
          name: sources

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install (Windows, Linux)
        if: runner.os != 'macOS'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      # macOS: the wheels for macOS 11 and up, not the ones of the runner
      # (numpy and onnxruntime have builds that only run on macOS 14)
      - name: Install (macOS)
        if: runner.os == 'macOS'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt
          pip install --only-binary=:all: --platform ${{ matrix.platform }} --python-version 3.12 --implementation cp --target site -r requirements.txt
          echo "PYTHONPATH=$PWD/site" >> $GITHUB_ENV

      # the loops, the stretched segments and the OpenVINO backend, without a model
      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Build
        run: pyinstaller --noconfirm --clean whisper-faster.spec

      - name: Test the arguments
        shell: bash
        run: |
          dist/whisper-faster/whisper-faster --version | tee version.txt
          grep -q "${{ needs.check.outputs.version }}" version.txt
          dist/whisper-faster/whisper-faster --help > /dev/null

      # a short phrase with the voice of each system, transcribed with the
      # tiny model on the CPU
      - name: Test voice (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y -qq espeak-ng > /dev/null
          espeak-ng -s 140 -w test.wav "Hello, this is a test of the subtitle program."

      - name: Test voice (macOS)
        if: runner.os == 'macOS'
        run: say -o test.wav --file-format=WAVE --data-format=LEI16@22050 "Hello, this is a test of the subtitle program."

      - name: Test voice (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Speech
          $s = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $s.SetOutputToWaveFile("$PWD\test.wav")
          $s.Speak("Hello, this is a test of the subtitle program.")
          $s.Dispose()

      - name: Test a transcription
        shell: bash
        run: |
          dist/whisper-faster/whisper-faster test.wav --model tiny --model_dir models --device cpu --language en --output_format srt --output_dir out
          cat out/test.srt
          grep -q -- "-->" out/test.srt
          grep -qi "test" out/test.srt

      # the speaker model is downloaded from the sherpa-onnx releases
      - name: Test the speakers
        shell: bash
        run: |
          dist/whisper-faster/whisper-faster test.wav --model tiny --model_dir models --device cpu --language en --output_format json --output_dir out --diarize True
          grep -q '"speaker": 1' out/test.json

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/whisper-faster/* -DestinationPath ${{ matrix.zip }}

      # zip keeps the execute permission (Tero extracts it with TUnZipper)
      - name: Zip (macOS, Linux)
        if: runner.os != 'Windows'
        run: cd dist/whisper-faster && zip -qry ../../${{ matrix.zip }} .

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.zip }}
          path: ${{ matrix.zip }}

  # cuBLAS and cuDNN for CTranslate2 4.x on Windows (CUDA 12, cuDNN 9), the
  # DLLs at the root of the zip so they end next to whisper-faster.exe
  gpu-windows:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download the NVIDIA libraries
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install --target nv "nvidia-cublas-cu12==12.*" "nvidia-cudnn-cu12==9.*" "nvidia-cuda-runtime-cu12==12.*"
          mkdir cuda
          find nv/nvidia -name "*.dll" -exec cp {} cuda/ \;
          ls -la cuda

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path cuda/* -DestinationPath fasterwhisper_cuda_win64.zip

      - uses: actions/upload-artifact@v6
        with:
          name: fasterwhisper_cuda_win64.zip
          path: fasterwhisper_cuda_win64.zip

  # OpenVINO GenAI (--device openvino, Intel GPUs and NPUs), about 200 MB: an
  # "openvino" folder extracted next to whisper-faster, as the GPU zip.
  # Tested with the build of the same system and the OpenVINO tiny model
  # (on the CPU of the runner).
  openvino:
    needs: [check, build]
    if: needs.check.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            zip: fasterwhisper_openvino_win64.zip
            build: fasterwhisper_win64.zip
          - os: ubuntu-22.04
            zip: fasterwhisper_openvino_linux.zip
            build: fasterwhisper_linux.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps --target openvino -r requirements-openvino.txt
          # the model converters are not needed to run the models
          rm -rf openvino/openvino/tools openvino/bin
          du -sh openvino

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path openvino -DestinationPath ${{ matrix.zip }}

      - name: Zip (Linux)
        if: runner.os != 'Windows'
        run: zip -qry ${{ matrix.zip }} openvino

      - uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.build }}

      - name: Test voice (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y -qq espeak-ng > /dev/null
          espeak-ng -s 140 -w test.wav "Hello, this is a test of the subtitle program."

      - name: Test voice (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Speech
          $s = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $s.SetOutputToWaveFile("$PWD\test.wav")
          $s.Speak("Hello, this is a test of the subtitle program.")
          $s.Dispose()

      - name: Test a transcription
        shell: bash
        run: |
          mkdir app && cd app
          if [ "$RUNNER_OS" = "Windows" ]; then
            python -m zipfile -e ../${{ matrix.build }} . && python -m zipfile -e ../${{ matrix.zip }} .
          else
            unzip -q ../${{ matrix.build }} && unzip -q ../${{ matrix.zip }}
          fi
          ./whisper-faster ../test.wav --model tiny --model_dir ../models --device openvino --language en --output_format srt --output_dir ../out 2>&1 | tee ../log.txt
          cat ../out/test.srt
          grep -q "device: openvino" ../log.txt
          grep -qi "test" ../out/test.srt

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.zip }}
          path: ${{ matrix.zip }}

  # Intel Macs with macOS 10.11 to 10.15 (macos-legacy.yml)
  macos-legacy:
    needs: check
    if: needs.check.outputs.build == 'true'
    uses: ./.github/workflows/macos-legacy.yml

  # every release has all the zips, Tero downloads them from "latest"
  release:
    needs: [check, build, gpu-windows, openvino, macos-legacy]
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.check.outputs.version }}
      SUMMARY: ${{ needs.check.outputs.summary }}
    steps:
      - uses: actions/checkout@v5
        if: needs.check.outputs.update == 'true'
        with:
          ref: main

      - name: New versions
        if: needs.check.outputs.update == 'true'
        uses: actions/download-artifact@v7
        with:
          name: sources

      - name: Commit and tag the new versions
        if: needs.check.outputs.update == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update to $SUMMARY"
          git tag "v$VERSION"
          git push origin HEAD:main "v$VERSION"

      - uses: actions/download-artifact@v7
        with:
          path: out
          pattern: fasterwhisper_*
          merge-multiple: true

      - name: Release
        run: |
          if [ "${{ needs.check.outputs.update }}" = "true" ]; then
            tag="v$VERSION"
            notes="Updated automatically: $SUMMARY."
          else
            tag="${{ github.ref_name }}"
            notes="UWFaster-Whisper $tag"
          fi
          gh release create "$tag" out/*.zip --repo "${{ github.repository }}" --title "UWFaster-Whisper $tag" --notes "$notes" --latest
